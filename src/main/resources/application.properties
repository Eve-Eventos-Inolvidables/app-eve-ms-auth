spring.application.name=app-eve-ms-auth
server.port=8088

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Credenciales (no versionado) y configuración común del equipo
spring.config.import=classpath:config/private.properties,classpath:eve-common-defaults.properties

# DataSource
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# Swagger
springdoc.api-docs.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG

# JWT (el secreto va en private.properties)
jwt.expiration-minutes=9999
jwt.algorithm=HS256
jwt.issuer=app-eve-auth
jwt.claim.user=id
jwt.claim.roles=roles

# Contraseñas
security.bcrypt-strength=12

#Cache
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

cache.users.ttl-days = 1
cache.roles.ttl-days = 60